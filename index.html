<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>अपना हेयर बाज़ार</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}
.wrap{max-width:900px;margin:auto;padding:16px}
.hero,.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0001}
h1{margin:0 0 5px}
button{border:0;border-radius:10px;padding:11px 14px;margin:5px;background:#172033;color:white;font-weight:700}
button.secondary{background:#e9edf5;color:#172033}
input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3df;border-radius:9px;margin:5px 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.muted{color:#667085}
.service,.salon{border:1px solid #e0e5ed;border-radius:12px;padding:12px;margin:8px 0}
.ok{color:#087f5b}
.danger{color:#b42318}
.day{border:1px solid #e0e5ed;border-radius:12px;padding:12px;margin:8px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none}
#qrcode{padding:10px;text-align:center}
</style>
</head>

<body>
<div class="wrap">

<div class="hero">
<h1>✂️ अपना हेयर बाज़ार</h1>
<div>हर सैलून की अपनी डिजिटल दुकान</div>
<div id="status" class="muted">Connecting...</div>
</div>

<div class="tabs">
<button onclick="show('customer')">👤 ग्राहक</button>
<button onclick="show('owner')">💈 सैलून मालिक</button>
<button onclick="show('register')">➕ सैलून जोड़ें</button>
</div>

<section id="customer">
<div class="card">
<h2>🔎 सैलून खोजें</h2>
<div id="salons" class="grid"></div>
</div>

<div id="publicSalon"></div>
</section>

<section id="owner" class="hidden">
<div class="card">
<h2>💈 सैलून मालिक</h2>

<select id="ownerSalon" onchange="loadOwner()">
<option value="">सैलून चुनें</option>
</select>

</div>

<div id="ownerPanel"></div>
</section>

<section id="register" class="hidden">
<div class="card">
<h2>➕ नया सैलून जोड़ें</h2>

<input id="rName" placeholder="Salon Name">
<input id="rOwner" placeholder="Owner Name">
<input id="rPhone" placeholder="Mobile Number">
<input id="rArea" placeholder="Village / City / Address">

<button onclick="registerSalon()">
सैलून जोड़ें
</button>

</div>
</section>

</div>

<script>

const SUPABASE_URL='https://xwkxnpxixrrjuooamrcw.supabase.co';

const SUPABASE_ANON_KEY='sb_publishable_T-jquuQOszaWlcmfBLdPOA_Mh10C9QN';

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let currentSalon=null;
let currentLink='';

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));

function show(id){

['customer','owner','register'].forEach(x=>
document.getElementById(x)
.classList.toggle('hidden',x!==id)
);

if(id==='customer')loadSalons();

if(id==='owner')loadOwnerList();

}
  async function init(){

document.getElementById('status').textContent='● Supabase connected';

await loadSalons();
await loadOwnerList();

const slug=new URLSearchParams(location.search).get('salon');

if(slug)openPublic(slug);

}

async function loadSalons(){

const {data,error}=await db
.from('salons')
.select('*')
.eq('active',true)
.order('created_at',{ascending:false});

const box=document.getElementById('salons');

if(error){

box.innerHTML='<p class="danger">Salon load error</p>';

return;

}

box.innerHTML=(data||[]).map(s=>`

<div class="salon">

<h3>${esc(s.name)}</h3>

<p>${esc(s.area||'')}</p>

<p>Owner: ${esc(s.owner_name||'')}</p>

<button onclick="openPublic('${esc(s.slug||s.id)}')">
सैलून खोलें
</button>

</div>

`).join('')||'<p>अभी कोई salon नहीं है।</p>';

}

async function openPublic(slug){

let q=await db
.from('salons')
.select('*')
.eq('slug',slug)
.maybeSingle();

if(!q.data)

q=await db
.from('salons')
.select('*')
.eq('id',slug)
.maybeSingle();

const s=q.data;

if(!s){

alert('Salon नहीं मिला');

return;

}

currentSalon=s;

const {data:services}=await db
.from('services')
.select('*')
.eq('salon_id',s.id)
.eq('active',true);

document.getElementById('publicSalon').innerHTML=`

<div class="card">

<h2>✂️ ${esc(s.name)}</h2>

<p>${esc(s.area||'')}</p>

<h3>Services</h3>

${(services||[]).map((v,i)=>`

<div class="service">

<b>${esc(v.name)}</b> — ₹${esc(v.price)}

<br>

<button onclick="book('${s.id}','${esc(v.name)}',${Number(v.price)||0})">
Book
</button>

</div>

`).join('')||'<p>No services yet.</p>'}

</div>
`;

window.scrollTo(
0,
document.getElementById('publicSalon').offsetTop
);

}
  function book(salonId,service,amount){

document.getElementById('publicSalon').innerHTML+=`

<div class="card" id="bookingBox">

<h3>📅 Booking: ${esc(service)}</h3>

<input id="bName" placeholder="आपका नाम">

<input id="bPhone" placeholder="मोबाइल नंबर">

<input id="bDate" type="date">

<input id="bTime" type="time">

<button onclick="saveBooking('${salonId}','${esc(service)}',${amount})">
Booking Confirm करें
</button>

</div>
`;

document.getElementById('bookingBox').scrollIntoView();

}

async function saveBooking(salonId,service,amount){

const {error}=await db
.from('bookings')
.insert({

salon_id:salonId,

customer_name:
document.getElementById('bName').value.trim(),

customer_phone:
document.getElementById('bPhone').value.trim(),

service_name:service,

amount,

booking_date:
document.getElementById('bDate').value,

booking_time:
document.getElementById('bTime').value,

status:'pending',

payment_method:'cash'

});

if(error){

alert(error.message);

return;

}

alert('✅ Booking हो गई');

document.getElementById('bookingBox')?.remove();

}

async function loadOwnerList(){

const {data}=await db
.from('salons')
.select('*')
.order('name');

document.getElementById('ownerSalon').innerHTML=
'<option value="">सैलून चुनें</option>'+
(data||[]).map(s=>
`<option value="${esc(s.id)}">${esc(s.name)}</option>`
).join('');

}

async function loadOwner(){

const id=document.getElementById('ownerSalon').value;

if(!id){

document.getElementById('ownerPanel').innerHTML='';

return;

}

const {data:s}=await db
.from('salons')
.select('*')
.eq('id',id)
.single();

currentSalon=s;

currentLink=
location.origin+
location.pathname+
'?salon='+
encodeURIComponent(s.slug||s.id);

document.getElementById('ownerPanel').innerHTML=`

<div class="card">

<h3>📊 Live Bookings</h3>

<div id="bookings">Loading...</div>

</div>

<div class="card">

<h3>🕒 Timetable & Slots</h3>

<p class="muted">
दुकानदार यहीं से हर दिन का समय और slot सेट करेगा।
</p>

<div id="days"></div>

<label>Default Slot Minutes</label>

<select id="slotDefault">

<option>15</option>
<option selected>30</option>
<option>45</option>
<option>60</option>

</select>

<button onclick="saveTimetable()">
💾 Timetable Save करें
</button>

</div>

<div class="card">

<h3>📱 मेरा QR और Share Link</h3>

<div id="qrcode"></div>

<input id="qrLink" readonly value="${esc(currentLink)}">

<button onclick="copyLink()">
📋 Link Copy करें
</button>

<button onclick="shareLink()">
📤 Share करें
</button>

<button onclick="whatsapp()">
💬 WhatsApp पर Share करें
</button>

</div>
`;

renderDays();

loadBookings(id);

loadTimetable(id);

new QRCode(
document.getElementById('qrcode'),
{
text:currentLink,
width:220,
height:220
}
);

  }
  const dayNames=[
'रविवार',
'सोमवार',
'मंगलवार',
'बुधवार',
'गुरुवार',
'शुक्रवार',
'शनिवार'
];

function renderDays(saved=[]){

document.getElementById('days').innerHTML=
dayNames.map((d,i)=>{

const x=saved.find(v=>v.day_of_week===i)||{};

return `

<div class="day">

<b>${d}</b>

<label>
<input
type="checkbox"
id="open${i}"
${x.is_open===false?'':'checked'}>
खुला
</label>

<div class="row">

<input
id="start${i}"
type="time"
value="${x.opening_time||'09:00'}">

<input
id="end${i}"
type="time"
value="${x.closing_time||'20:00'}">

</div>

<select id="slot${i}">

<option ${x.slot_minutes==15?'selected':''}>
15
</option>

<option ${!x.slot_minutes||x.slot_minutes==30?'selected':''}>
30
</option>

<option ${x.slot_minutes==45?'selected':''}>
45
</option>

<option ${x.slot_minutes==60?'selected':''}>
60
</option>

</select>

</div>

`;

}).join('');

}

async function loadTimetable(salonId){

const {data}=await db
.from('salon_timetable')
.select('*')
.eq('salon_id',salonId)
.order('day_of_week');

renderDays(data||[]);

}

async function saveTimetable(){

if(!currentSalon)return;

const rows=dayNames.map((_,i)=>({

salon_id:currentSalon.id,

day_of_week:i,

is_open:
document.getElementById('open'+i).checked,

opening_time:
document.getElementById('start'+i).value,

closing_time:
document.getElementById('end'+i).value,

slot_minutes:
Number(document.getElementById('slot'+i).value)

}));

const {error}=await db
.from('salon_timetable')
.upsert(
rows,
{onConflict:'salon_id,day_of_week'}
);

if(error){

alert('Save error: '+error.message);

return;

}

alert('✅ Timetable & Slots save हो गए');

}

async function loadBookings(id){

const {data,error}=await db
.from('bookings')
.select('*')
.eq('salon_id',id)
.order('booking_date',{ascending:true})
.order('booking_time',{ascending:true});

const box=document.getElementById('bookings');

if(error){

box.textContent=error.message;

return;

}

box.innerHTML=(data||[]).map(b=>`

<div class="service">

<b>${esc(b.customer_name)}</b>
—
${esc(b.customer_phone)}

<br>

${esc(b.service_name)}
₹${esc(b.amount)}

<br>

📅 ${esc(b.booking_date)}
⏰ ${esc(b.booking_time)}

<br>

Status:
${esc(b.status||'pending')}

</div>

`).join('')||
'<p>अभी कोई booking नहीं।</p>';

  }
  async function registerSalon(){

const name=document.getElementById('rName').value.trim();

if(!name){

alert('Salon name डालें');

return;

}

const slug=
name.toLowerCase()
.replace(/[^a-z0-9]+/g,'-')
.replace(/^-|-$/g,'')+
'-'+
Math.random().toString(36).slice(2,6);

const {data,error}=await db
.from('salons')
.insert({

name,

slug,

owner_name:
document.getElementById('rOwner').value.trim(),

phone:
document.getElementById('rPhone').value.trim(),

area:
document.getElementById('rArea').value.trim(),

active:true

})
.select()
.single();

if(error){

alert(error.message);

return;

}

for(const x of [
{name:'Hair Cut',price:150},
{name:'Beard',price:100}
])

await db
.from('services')
.insert({

salon_id:data.id,

name:x.name,

price:x.price,

active:true

});

alert('✅ Salon बन गया');

await loadSalons();

await loadOwnerList();

show('owner');

document.getElementById('ownerSalon').value=data.id;

loadOwner();

}

async function copyLink(){

try{

await navigator.clipboard.writeText(currentLink);

alert('✅ Link Copy हो गया');

}catch(e){

document.getElementById('qrLink').select();

document.execCommand('copy');

alert('✅ Link Copy हो गया');

}

}

async function shareLink(){

if(navigator.share){

try{

await navigator.share({

title:'अपना हेयर बाज़ार',

text:'इस सैलून में online appointment book करें:',

url:currentLink

});

}catch(e){}

}else copyLink();

}

function whatsapp(){

window.open(

'https://wa.me/?text='+

encodeURIComponent(

'✂️ अपना हेयर बाज़ार\n\n'+

'इस सैलून में online appointment book करें 👇\n\n'+

currentLink

),

'_blank'

);

}

init();

</script>

</body>

</html>
