 <!doctype html>
<html lang="hi">
<head> <meta name="google-site-verification" content="0CbuiYpsCxgmnpGsocFsug3u5au8ASHEf3zLByVWsJI" />
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>अपना हेयर बाज़ार</title>
<meta name="theme-color" content="#111827">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f8;color:#172033}
header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.sub{font-size:12px;opacity:.75}
main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0000000b}
h2,h3{margin:5px 0 12px}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #d7dce3;font:inherit}button{background:#111827;color:#fff;border:0;font-weight:700}.secondary{background:#eef0f3;color:#172033}.success{background:#16794b}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.hidden{display:none!important}
.service{border:1px solid #e3e6ea;padding:12px;border-radius:14px}.price{font-weight:800}.pill{display:inline-block;background:#eef2ff;padding:5px 9px;border-radius:99px;font-size:12px;margin:3px}
.booking{border-left:4px solid #111827;padding:10px;margin:8px 0;background:#fafafa;border-radius:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:20}
#status{font-size:12px;padding:8px 10px;border-radius:10px;background:#fff3cd;color:#7a5b00}.ok{background:#dcfce7!important;color:#166534!important}
</style>
</head>
<body>
<header><div class="brand">✂️ अपना हेयर बाज़ार</div><div class="sub">हर सैलून की अपनी डिजिटल दुकान</div></header>
<main>
<div id="status">Realtime setup बाकी है — पहले Supabase जोड़ें।</div>
<div class="nav">
<button onclick="show('customer')">ग्राहक</button>
<button onclick="show('owner')">सैलून मालिक</button>
<button onclick="show('register')">सैलून जोड़ें</button>
</div>

<section id="customer">
<div class="card"><h2>सैलून खोजें</h2><div id="salons" class="grid"></div></div>
<div id="salonView" class="card hidden"></div>
<div id="bookingView" class="card hidden"></div>
</section>

<section id="register" class="hidden">
<div class="card">
<h2>अपना सैलून जोड़ें</h2>
<p class="muted">यहाँ से नया दुकानदार अपना अलग salon page बना सकेगा।</p>
<input id="rName" placeholder="सैलून का नाम"><br><br>
<input id="rOwner" placeholder="मालिक का नाम"><br><br>
<input id="rPhone" placeholder="मोबाइल नंबर"><br><br>
<input id="rArea" placeholder="गाँव / शहर / पता"><br><br>
<button onclick="registerSalon()">सैलून जोड़ें</button>
</div>
</section>

<section id="owner" class="hidden">
<div class="card">
<h2>सैलून मालिक डैशबोर्ड</h2>
<select id="ownerSalon" onchange="renderOwner()"></select>
</div>
<div id="ownerStats" class="grid"></div>
<div class="card"><h3>Live Bookings</h3><div id="ownerBookings"></div></div>
<div class="card"><h3>मेरा QR</h3><div id="qrcode"></div><p id="qrLink" class="muted"></p></div>
</section>
</main>
<div id="toast"></div>

<script>
const SUPABASE_URL = "https://xwkxnpxixrrjuooamrcw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_T-jquuQOszaWlcmfBLdPOA_Mh10C9QN";
let db=null, selectedSalon=null, selectedService=null, salons=[], bookings=[];

if(!SUPABASE_URL.startsWith("PASTE_") && !SUPABASE_ANON_KEY.startsWith("PASTE_")){
  db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  document.getElementById('status').textContent='● Realtime connected';
  document.getElementById('status').classList.add('ok');
  startRealtime();
}else{
  salons=[
   {id:'demo-vishal',name:'Vishal Hair Cut',owner_name:'Demo Owner',phone:'',area:'Demo',services:[{name:'Hair Cut',price:150},{name:'Beard',price:100},{name:'Hair Cut + Beard',price:220},{name:'Facial',price:300}]},
   {id:'demo-raja',name:'Raja Hair Salon',owner_name:'Demo Owner',phone:'',area:'Demo',services:[{name:'Hair Cut',price:180},{name:'Beard',price:120},{name:'Hair Color',price:450},{name:'Facial',price:350}]}
  ];
  renderSalons();
}

function show(x){['customer','owner','register'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==x));if(x==='owner')initOwner();}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}

async function startRealtime(){
 await loadSalons();
 db.channel('bookings-live').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},()=>{loadBookings();renderOwner();}).subscribe();
}
async function loadSalons(){
 const {data,error}=await db.from('salons').select('*').eq('active',true).order('name');
 if(error){toast(error.message);return}
 salons=data||[];renderSalons();
}
async function loadBookings(){
 if(!db)return;
 const {data}=await db.from('bookings').select('*').order('created_at',{ascending:false});
 bookings=data||[];renderOwner();
}
function renderSalons(){
 document.getElementById('salons').innerHTML=salons.map(s=>`<button class="secondary" onclick="openSalon('${s.id}')"><b>${s.name}</b><br><span class="muted">${s.area||''}</span></button>`).join('')||'<p class="muted">अभी कोई salon नहीं।</p>';
}
async function openSalon(id){
 selectedSalon=salons.find(s=>String(s.id)===String(id));selectedService=null;
 let services=selectedSalon.services||[];
 if(db){
  const {data}=await db.from('services').select('*').eq('salon_id',id).eq('active',true).order('name');
  services=data||[];
 }
 selectedSalon._services=services;
 const v=document.getElementById('salonView');v.classList.remove('hidden');
 v.innerHTML=`<h2>${selectedSalon.name}</h2><div class="muted">${selectedSalon.area||''}</div><h3>Services</h3><div class="grid">${services.map((x,i)=>`<div class="service"><b>${x.name}</b><br><span class="price">₹${x.price}</span><br><br><button onclick="selectService(${i})">चुनें</button></div>`).join('')}</div>`;
 v.scrollIntoView({behavior:'smooth'});
}
function selectService(i){selectedService=selectedSalon._services[i];toast(selectedService.name+' चुना गया');openBooking()}
function openBooking(){
 const b=document.getElementById('bookingView');b.classList.remove('hidden');
 b.innerHTML=`<h2>Appointment</h2><p><b>${selectedSalon.name}</b> · ${selectedService.name} · ₹${selectedService.price}</p>
 <input id="custName" placeholder="आपका नाम"><br><br><input id="custPhone" placeholder="मोबाइल नंबर"><br><br>
 <input id="date" type="date"><br><br><input id="time" type="time" value="10:00"><br><br>
 <button class="success" onclick="confirmBooking()">बुकिंग कन्फर्म करें</button>
 <p class="muted">अभी payment gateway नहीं जोड़ा गया है; booking real database में जाएगी।</p>`;
 document.getElementById('date').value=new Date().toISOString().slice(0,10);
}
async function confirmBooking(){
 const customer_name=document.getElementById('custName').value.trim(),customer_phone=document.getElementById('custPhone').value.trim();
 if(!customer_name||!customer_phone){toast('नाम और मोबाइल भरें');return}
 if(!db){toast('Realtime चालू करने के बाद booking online होगी');return}
 const row={salon_id:selectedSalon.id,customer_name,customer_phone,service_name:selectedService.name,amount:selectedService.price,booking_date:document.getElementById('date').value,booking_time:document.getElementById('time').value,status:'confirmed'};
 const {error}=await db.from('bookings').insert(row);
 if(error){toast(error.message);return}
 document.getElementById('bookingView').innerHTML='<h2>✅ Booking Confirmed</h2><p>आपकी booking online save हो गई है।</p><p class="muted">Salon owner के dashboard में तुरंत दिखाई देगी।</p>';
 await loadBookings();toast('Booking online save हो गई');
}
async function registerSalon(){
 if(!db){toast('पहले Supabase setup करें');return}
 const name=document.getElementById('rName').value.trim(),owner_name=document.getElementById('rOwner').value.trim(),phone=document.getElementById('rPhone').value.trim(),area=document.getElementById('rArea').value.trim();
 if(!name||!phone){toast('Salon name और mobile जरूरी है');return}
 const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,6);
 const {data,error}=await db.from('salons').insert({name,slug,owner_name,phone,area,active:true}).select().single();
 if(error){toast(error.message);return}
 await db.from('services').insert([{salon_id:data.id,name:'Hair Cut',price:150,active:true},{salon_id:data.id,name:'Beard',price:100,active:true}]);
 await loadSalons();toast('Salon जुड़ गया');show('owner');
 document.getElementById('ownerSalon').value=data.id;renderOwner();
}
async function initOwner(){if(db)await loadBookings();let s=document.getElementById('ownerSalon');s.innerHTML=salons.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');renderOwner();}
function renderOwner(){
 if(!document.getElementById('owner')||document.getElementById('owner').classList.contains('hidden'))return;
 const id=document.getElementById('ownerSalon')?.value;if(!id)return;
 const bs=bookings.filter(b=>String(b.salon_id)===String(id));
 document.getElementById('ownerStats').innerHTML=`<div class="card"><b>${bs.length}</b><br><span class="muted">Bookings</span></div><div class="card"><b>₹${bs.reduce((a,b)=>a+Number(b.amount||0),0)}</b><br><span class="muted">Revenue</span></div>`;
 document.getElementById('ownerBookings').innerHTML=bs.length?bs.map(b=>`<div class="booking"><b>${b.customer_name}</b><br>${b.service_name} · ₹${b.amount}<br><span class="muted">${b.booking_date} · ${b.booking_time} · ${b.customer_phone}</span></div>`).join(''):'<p class="muted">अभी कोई booking नहीं।</p>';
 const salon=salons.find(s=>String(s.id)===String(id));const slug=salon?.slug||id;const link=location.origin+location.pathname+'?salon='+slug;
 document.getElementById('qrLink').textContent=link;
 const q=document.getElementById('qrcode');q.innerHTML='';if(window.QRCode)new QRCode(q,{text:link,width:180,height:180});
}
(function(){const p=new URLSearchParams(location.search);const slug=p.get('salon');if(slug&&db){setTimeout(async()=>{const {data}=await db.from('salons').select('*').eq('slug',slug).single();if(data)openSalon(data.id)},700);}})();
</script>
</body></html>
