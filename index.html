<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>अपना हेयर बाज़ार</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}
.wrap{max-width:900px;margin:auto;padding:16px}
.hero,.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0001}
h1{margin:0 0 5px}
button{border:0;border-radius:10px;padding:11px 14px;margin:5px;background:#172033;color:white;font-weight:700}
button.secondary{background:#e9edf5;color:#172033}
input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3df;border-radius:9px;margin:5px 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.muted{color:#667085}
.service,.salon{border:1px solid #e0e5ed;border-radius:12px;padding:12px;margin:8px 0}
.ok{color:#087f5b}
.danger{color:#b42318}
.day{border:1px solid #e0e5ed;border-radius:12px;padding:12px;margin:8px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none}
#qrcode{padding:10px;text-align:center}
.small{font-size:13px}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
<h1>✂️ अपना हेयर बाज़ार</h1>
<div>हर सैलून की अपनी डिजिटल दुकान</div>
<div id="status" class="muted">Connecting...</div>
</div>

<div class="tabs">
<button onclick="show('customer')">👤 ग्राहक</button>
<button onclick="show('owner')">💈 सैलून मालिक</button>
<button onclick="show('register')">➕ सैलून जोड़ें</button>
</div>

<section id="customer">

<div class="card">
<h2>🔎 सैलून खोजें</h2>
<div id="salons" class="grid"></div>
</div>

<div id="publicSalon"></div>

</section>


<section id="owner" class="hidden">

<div class="card">
<h2>💈 सैलून मालिक</h2>

<select id="ownerSalon" onchange="loadOwner()">
<option value="">सैलून चुनें</option>
</select>

</div>

<div id="ownerPanel"></div>

</section>


<section id="register" class="hidden">

<div class="card">

<h2>➕ नया सैलून जोड़ें</h2>

<input id="rName" placeholder="Salon Name">
<input id="rOwner" placeholder="Owner Name">
<input id="rPhone" placeholder="Mobile Number">
<input id="rArea" placeholder="Village / City / Address">

<button onclick="registerSalon()">सैलून जोड़ें</button>

</div>

</section>

</div>


<script>

const SUPABASE_URL =
'https://xwkxnpxixrrjuooamrcw.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_T-jquuQOszaWlcmfBLdPOA_Mh10C9QN';

const db =
supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentSalon=null;
let currentLink='';


function esc(s){
return String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));
}


/* =========================
   TAB
========================= */

function show(id){

['customer','owner','register']
.forEach(x=>{
document.getElementById(x)
.classList.toggle('hidden',x!==id);
});

if(id==='customer') loadSalons();

if(id==='owner') loadOwnerList();

}


/* =========================
   INIT
========================= */

async function init(){

document.getElementById('status').textContent=
'● Supabase connected';

await loadSalons();
await loadOwnerList();

const slug=
new URLSearchParams(location.search).get('salon');

if(slug){
openPublic(slug);
}

}


/* =========================
   SALON LIST
========================= */

async function loadSalons(){

const {data,error}=
await db
.from('salons')
.select('*')
.eq('active',true)
.order('created_at',{ascending:false});

const box=document.getElementById('salons');

if(error){
box.innerHTML=
'<p class="danger">Salon load error: '+esc(error.message)+'</p>';
return;
}

box.innerHTML=
(data||[]).map(s=>`

<div class="salon">

<h3>${esc(s.name)}</h3>

<p>${esc(s.area||'')}</p>

<p>Owner: ${esc(s.owner_name||'')}</p>

<button onclick="openPublic('${esc(s.slug||s.id)}')">
सैलून खोलें
</button>

</div>

`).join('')||

'<p>अभी कोई salon नहीं है।</p>';

}


/* =========================
   PUBLIC SALON
========================= */

async function openPublic(slug){

let q=
await db
.from('salons')
.select('*')
.eq('slug',slug)
.maybeSingle();

if(!q.data){

q=
await db
.from('salons')
.select('*')
.eq('id',slug)
.maybeSingle();

}

const s=q.data;

if(!s){

alert('Salon नहीं मिला');
return;

}

currentSalon=s;

const {data:services}=

await db
.from('services')
.select('*')
.eq('salon_id',s.id)
.eq('active',true);

document.getElementById('publicSalon').innerHTML=`

<div class="card">

<h2>✂️ ${esc(s.name)}</h2>

<p>${esc(s.area||'')}</p>

<h3>Services</h3>

${
(services||[]).map(v=>`

<div class="service">

<b>${esc(v.name)}</b>
— ₹${esc(v.price)}

<br>

<button onclick="book('${s.id}','${esc(v.name)}',${Number(v.price)||0})">
Book
</button>

</div>

`).join('')

||

'<p>No services yet.</p>'

}

</div>

`;

window.scrollTo(
0,
document.getElementById('publicSalon').offsetTop
);

}


/* =========================
   BOOKING FORM
========================= */

async function book(salonId,service,amount){

document.getElementById('publicSalon').innerHTML+=`

<div class="card" id="bookingBox">

<h3>📅 Booking: ${esc(service)}</h3>

<input id="bName" placeholder="आपका नाम">

<input id="bPhone" placeholder="मोबाइल नंबर">

<label>📅 तारीख</label>

<input id="bDate" type="date"
onchange="loadCustomerSlots('${salonId}')">

<label>⏰ समय</label>

<select id="bTime">

<option value="">पहले तारीख चुनें</option>

</select>

<button onclick="saveBooking('${salonId}','${esc(service)}',${amount})">

Booking Confirm करें

</button>

</div>

`;

const dateInput=document.getElementById('bDate');

const today=
new Date().toISOString().split('T')[0];

dateInput.min=today;
dateInput.value=today;

await loadCustomerSlots(salonId);

document.getElementById('bookingBox').scrollIntoView();

}


/* =========================
   CUSTOMER SLOTS
========================= */

async function loadCustomerSlots(salonId){

const date=
document.getElementById('bDate')?.value;

const timeBox=
document.getElementById('bTime');

if(!date||!timeBox)return;

const day=
new Date(date+'T00:00:00').getDay();

const {data:timetable,error}=

await db
.from('salon_timetable')
.select('*')
.eq('salon_id',salonId)
.eq('day_of_week',day)
.maybeSingle();

if(error){

timeBox.innerHTML=
'<option>Timetable error</option>';

return;

}

if(!timetable||timetable.is_open===false){

timeBox.innerHTML=
'<option value="">इस दिन सैलून बंद है</option>';

return;

}


const {data:bookings}=

await db
.from('bookings')
.select('booking_time')
.eq('salon_id',salonId)
.eq('booking_date',date);


const booked=
new Set(
(bookings||[]).map(x=>
String(x.booking_time).slice(0,5)
)
);


const slots=[];

let start=
timeToMinutes(timetable.opening_time);

const end=
timeToMinutes(timetable.closing_time);

const step=
Number(timetable.slot_minutes)||30;


while(start<end){

const h=
String(Math.floor(start/60)).padStart(2,'0');

const m=
String(start%60).padStart(2,'0');

const value=h+':'+m;

if(!booked.has(value)){
slots.push(value);
}

start+=step;

}


timeBox.innerHTML=
slots.length
?

'<option value="">समय चुनें</option>'+
slots.map(x=>`<option value="${x}">${x}</option>`).join('')

:

'<option value="">आज सभी slots booked हैं</option>';

}


function timeToMinutes(t){

if(!t)return 0;

const p=String(t).slice(0,5).split(':');

return Number(p[0])*60+Number(p[1]);

}


/* =========================
   SAVE BOOKING
========================= */

async function saveBooking(
salonId,
service,
amount
){

const name=
document.getElementById('bName').value.trim();

const phone=
document.getElementById('bPhone').value.trim();

const date=
document.getElementById('bDate').value;

const time=
document.getElementById('bTime').value;


if(!name){

alert('अपना नाम डालें');
return;

}

if(!phone){

alert('मोबाइल नंबर डालें');
return;

}

if(!date){

alert('तारीख चुनें');
return;

}

if(!time){

alert('समय चुनें');
return;

}


const {error}=

await db
.from('bookings')
.insert({

salon_id:salonId,
customer_name:name,
customer_phone:phone,
service_name:service,
amount:amount,
booking_date:date,
booking_time:time,
status:'pending',
payment_method:'cash'

});


if(error){

alert(error.message);
return;

}

alert('✅ Booking हो गई');

document.getElementById('bookingBox')?.remove();

}


/* =========================
   OWNER LIST
========================= */

async function loadOwnerList(){

const {data,error}=

await db
.from('salons')
.select('*')
.order('name');

if(error)return;

document.getElementById('ownerSalon').innerHTML=

'<option value="">सैलून चुनें</option>'+

(data||[]).map(s=>
`<option value="${esc(s.id)}">${esc(s.name)}</option>`
).join('');

}


/* =========================
   OWNER DASHBOARD
========================= */

async function loadOwner(){

const id=
document.getElementById('ownerSalon').value;

if(!id){

document.getElementById('ownerPanel').innerHTML='';
return;

}


const {data:s}=

await db
.from('salons')
.select('*')
.eq('id',id)
.single();

if(!s)return;

currentSalon=s;

currentLink=
location.origin+
location.pathname+
'?salon='+
encodeURIComponent(s.slug||s.id);


document.getElementById('ownerPanel').innerHTML=`

<div class="card">

<h3>📊 Live Bookings</h3>

<div id="bookings">
Loading...
</div>

</div>


<div class="card">

<h3>🕒 Timetable & Slots</h3>

<p class="muted">
हर दिन का खुलने-बंद होने का समय और booking slot यहाँ सेट करें।
</p>

<div id="days"></div>

<button onclick="saveTimetable()">
💾 Timetable Save करें
</button>

</div>


<div class="card">

<h3>📱 मेरा QR और Share Link</h3>

<div id="qrcode"></div>

<input id="qrLink" readonly value="${esc(currentLink)}">

<button onclick="copyLink()">
📋 Link Copy
</button>

<button onclick="shareLink()">
📤 Share
</button>

<button onclick="whatsapp()">
💬 WhatsApp
</button>

<button onclick="openLink()">
🌐 Link खोलें
</button>

</div>

`;


renderDays();

loadBookings(id);

loadTimetable(id);


setTimeout(()=>{

const qr=
document.getElementById('qrcode');

if(qr){

qr.innerHTML='';

new QRCode(qr,{
text:currentLink,
width:220,
height:220
});

}

},100);

}


/* =========================
   TIMETABLE
========================= */

const dayNames=[
'रविवार',
'सोमवार',
'मंगलवार',
'बुधवार',
'गुरुवार',
'शुक्रवार',
'शनिवार'
];


function renderDays(saved=[]){

const box=
document.getElementById('days');

if(!box)return;


box.innerHTML=

dayNames.map((d,i)=>{

const x=
saved.find(v=>
Number(v.day_of_week)===i
)||{};


return `

<div class="day">

<b>📅 ${d}</b>

<label>

<input
type="checkbox"
id="open${i}"
${x.is_open===false?'':'checked'}
>

सैलून खुला

</label>


<div class="row">

<div>

<label class="small">
खुलने का समय
</label>

<input
id="start${i}"
type="time"
value="${String(x.opening_time||'09:00').slice(0,5)}"
>

</div>


<div>

<label class="small">
बंद होने का समय
</label>

<input
id="end${i}"
type="time"
value="${String(x.closing_time||'20:00').slice(0,5)}"
>

</div>

</div>


<label class="small">
Booking Slot
</label>

<select id="slot${i}">

<option value="15"
${Number(x.slot_minutes)===15?'selected':''}>
15 मिनट
</option>

<option value="30"
${!x.slot_minutes||Number(x.slot_minutes)===30?'selected':''}>
30 मिनट
</option>

<option value="45"
${Number(x.slot_minutes)===45?'selected':''}>
45 मिनट
</option>

<option value="60"
${Number(x.slot_minutes)===60?'selected':''}>
60 मिनट
</option>

</select>

</div>

`;

}).join('');

}


/* =========================
   LOAD TIMETABLE
========================= */

async function loadTimetable(salonId){

const {data,error}=

await db
.from('salon_timetable')
.select('*')
.eq('salon_id',salonId)
.order('day_of_week');


if(error){

console.log('Timetable:',error.message);

return;

}

renderDays(data||[]);

}


/* =========================
   SAVE TIMETABLE
========================= */

async function saveTimetable(){

if(!currentSalon)return;


const rows=
dayNames.map((_,i)=>({

salon_id:currentSalon.id,

day_of_week:i,

is_open:
document.getElementById('open'+i).checked,

opening_time:
document.getElementById('start'+i).value,

closing_time:
document.getElementById('end'+i).value,

slot_minutes:
Number(
document.getElementById('slot'+i).value
)

}));


const {error}=

await db
.from('salon_timetable')
.upsert(
rows,
{
onConflict:
'salon_id,day_of_week'
}
);


if(error){

alert(
'Save error: '+
error.message
);

return;

}


alert(
'✅ Timetable & Slots save हो गए'
);

}


/* =========================
   BOOKINGS
========================= */

async function loadBookings(id){

const {data,error}=

await db
.from('bookings')
.select('*')
.eq('salon_id',id)
.order('booking_date',{ascending:true})
.order('booking_time',{ascending:true});


const box=
document.getElementById('bookings');

if(!box)return;


if(error){

box.textContent=error.message;
return;

}


box.innerHTML=

(data||[]).map(b=>`

<div class="service">

<b>${esc(b.customer_name)}</b>

— ${esc(b.customer_phone)}

<br>

${esc(b.service_name)}
₹${esc(b.amount)}

<br>

📅 ${esc(b.booking_date)}
⏰ ${esc(b.booking_time)}

<br>

Status:
${esc(b.status||'pending')}

</div>

`).join('')

||

'<p>अभी कोई booking नहीं।</p>';

}


/* =========================
   REGISTER SALON
========================= */

async function registerSalon(){

const name=
document.getElementById('rName')
.value.trim();

if(!name){

alert('Salon name डालें');
return;

}


const slug=

name
.toLowerCase()
.replace(/[^a-z0-9]+/g,'-')
.replace(/^-|-$/g,'')
+
'-'+
Math.random()
.toString(36)
.slice(2,6);


const {data,error}=

await db
.from('salons')
.insert({

name:name,

slug:slug,

owner_name:
document.getElementById('rOwner')
.value.trim(),

phone:
document.getElementById('rPhone')
.value.trim(),

area:
document.getElementById('rArea')
.value.trim(),

active:true

})
.select()
.single();


if(error){

alert(error.message);
return;

}


for(
const x of [
{name:'Hair Cut',price:150},
{name:'Beard',price:100}
]
){

await db
.from('services')
.insert({

salon_id:data.id,
name:x.name,
price:x.price,
active:true

});

}


alert('✅ Salon बन गया');

await loadSalons();

await loadOwnerList();

show('owner');

document.getElementById('ownerSalon').value=
data.id;

loadOwner();

}


/* =========================
   COPY LINK
========================= */

async function copyLink(){

try{

await navigator.clipboard.writeText(currentLink);

alert('✅ Link Copy हो गया');

}catch(e){

const input=
document.getElementById('qrLink');

input.select();

document.execCommand('copy');

alert('✅ Link Copy हो गया');

}

}


/* =========================
   ANDROID SHARE
========================= */

async function shareLink(){

if(navigator.share){

try{

await navigator.share({

title:'अपना हेयर बाज़ार',

text:
'✂️ इस सैलून में online appointment book करें 👇',

url:currentLink

});

}catch(e){}

}else{

await copyLink();

}

}


/* =========================
   WHATSAPP
========================= */

function whatsapp(){

const text=

'✂️ अपना हेयर बाज़ार\n\n'+
'इस सैलून में online appointment book करें 👇\n\n'+
currentLink;


window.open(
'https://wa.me/?text='+
encodeURIComponent(text),
'_blank'
);

}


/* =========================
   OPEN LINK
========================= */

function openLink(){

window.open(
currentLink,
'_blank'
);

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
